<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Preview</title>
<!-- Dev-only page. ES modules need http(s): serve the v2 folder, e.g.
     `npx serve v2` or `python -m http.server` from v2/, then open /dev/sprites.html -->
<style>
  :root {
    --cream: #f2e6c9; --ink: #1a1c2c; --wood: #b07a4a; --gray: #566c86;
    --page: #e4d5b0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--page); color: var(--ink);
    font: 13px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 24px 0 8px; text-transform: uppercase; letter-spacing: .08em; }
  p.note { margin: 0 0 12px; color: var(--gray); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 8px; }
  .bar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 10px; }
  .card { border: 2px solid var(--ink); background: var(--cream); box-shadow: 3px 3px 0 var(--ink); }
  .card .key { padding: 4px 6px; border-bottom: 2px solid var(--ink); font-weight: 700; display: flex; justify-content: space-between; }
  .card .key small { font-weight: 400; color: var(--gray); }
  .halves { display: grid; grid-template-columns: 1fr 1fr; }
  .half { padding: 6px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .half.light { background: var(--cream); }
  .half.dark { background: var(--ink); }
  .row { display: flex; align-items: flex-end; gap: 6px; flex-wrap: wrap; }
  img, canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .tints { display: flex; gap: 2px; flex-wrap: wrap; }
  .tiled { width: 96px; height: 96px; background-size: 32px 32px; image-rendering: pixelated; border: 1px solid rgba(0,0,0,.2); }
  .err { background: #b13e53; color: #fff; padding: 8px; border: 2px solid var(--ink); }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>sprites.js preview</h1>
<p class="note">Each card: left = cream #f2e6c9, right = ink #1a1c2c. Shows 1x, 4x, then 2x tint variants (tinted sprites only). Tiles also show a 3x3 repeat.</p>
<div class="bar">
  <label><input type="checkbox" id="showTints" checked> tint variants</label>
  <label>filter <input type="search" id="filter" placeholder="key…" size="14"></label>
  <span id="count"></span>
</div>
<div id="out"></div>

<script type="module">
  import { SPRITE_KEYS, SPRITES, DEFAULT_TINTS, spriteCanvas, spriteURL } from '../js/sprites.js';

  const TINTS_A = ['#b13e53', '#ffcd75', '#8b5cb8', '#f4f4f4', '#41a6f6'];
  const TINTS_B = ['#ffcd75', '#1a1c2c', '#f4f4f4'];
  const usesA = (k) => SPRITES[k].rows.some((r) => /[AQ]/.test(r));
  const usesB = (k) => SPRITES[k].rows.some((r) => /[BV]/.test(r));
  const group = (k) => (k.startsWith('icon_') ? 'Icons' : k.startsWith('tile_') ? 'Tiles' : 'Plants');

  function img(key, tint, scale) {
    const c = spriteCanvas(key, tint, scale);
    c.title = key + (tint && Object.keys(tint).length ? ' ' + JSON.stringify(tint) : '');
    return c;
  }

  function half(cls, key) {
    const h = document.createElement('div');
    h.className = 'half ' + cls;
    const row = document.createElement('div');
    row.className = 'row';
    row.append(img(key, {}, 1), img(key, {}, 4));
    h.append(row);
    if (key.startsWith('tile_')) {
      const t = document.createElement('div');
      t.className = 'tiled';
      t.style.backgroundImage = `url(${spriteURL(key)})`;
      h.append(t);
    }
    if (usesA(key) || usesB(key)) {
      const tints = document.createElement('div');
      tints.className = 'tints';
      const variants = [];
      if (usesA(key)) for (const A of TINTS_A) variants.push({ A });
      if (usesB(key)) for (const B of TINTS_B) variants.push({ A: DEFAULT_TINTS[key]?.A, B });
      for (const v of variants) tints.append(img(key, v, 2));
      h.append(tints);
    }
    return h;
  }

  function card(key) {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.key = key;
    const head = document.createElement('div');
    head.className = 'key';
    const d = DEFAULT_TINTS[key];
    head.innerHTML = `<span></span><small></small>`;
    head.firstChild.textContent = key;
    head.lastChild.textContent = d ? Object.entries(d).map(([s, v]) => `${s}${v}`).join(' ') : '';
    const halves = document.createElement('div');
    halves.className = 'halves';
    halves.append(half('light', key), half('dark', key));
    el.append(head, halves);
    return el;
  }

  function render() {
    const out = document.getElementById('out');
    const q = document.getElementById('filter').value.trim().toLowerCase();
    document.body.classList.toggle('no-tints', !document.getElementById('showTints').checked);
    out.textContent = '';
    let n = 0;
    for (const g of ['Plants', 'Icons', 'Tiles']) {
      const keys = SPRITE_KEYS.filter((k) => group(k) === g && k.includes(q));
      if (!keys.length) continue;
      const h = document.createElement('h2');
      h.textContent = `${g} (${keys.length})`;
      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const k of keys) grid.append(card(k));
      out.append(h, grid);
      n += keys.length;
    }
    document.getElementById('count').textContent = `${n} / ${SPRITE_KEYS.length} sprites`;
  }

  const style = document.createElement('style');
  style.textContent = 'body.no-tints .tints { display: none; }';
  document.head.append(style);
  document.getElementById('filter').addEventListener('input', render);
  document.getElementById('showTints').addEventListener('change', render);
  render();
</script>
<script>
  // Surface module-load failures (e.g. opened via file://) instead of a blank page.
  window.addEventListener('error', (e) => {
    const d = document.createElement('div');
    d.className = 'err';
    d.textContent = 'Error: ' + e.message + ' — serve v2/ over http (file:// blocks ES module imports).';
    document.body.prepend(d);
  });
  setTimeout(() => {
    if (!document.querySelector('.card') && !document.querySelector('.err')) {
      const d = document.createElement('div');
      d.className = 'err';
      d.textContent = 'Nothing rendered — if you opened this via file://, serve the v2 folder over http instead.';
      document.body.prepend(d);
    }
  }, 1500);
</script>
</body>
</html>
